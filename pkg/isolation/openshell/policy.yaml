# Default OpenShell sandbox policy for an OpenCode agent run (ft run).
#
# This is the checked-in template: it is the source of truth for the safe
# defaults, and pkg/isolation/openshell renders the effective policy from it.
#
#   - Egress is deny-by-default: there is deliberately no network_policies
#     section, so the sandbox reaches nothing until a project opts in by host
#     name (see .factotum/openshell-policy.yaml). In particular OpenCode's
#     phone-home to models.opencode.ai and registry.npmjs.org stays denied.
#   - The shipped OpenCode image declares no USER, so a non-root identity is
#     mandatory; run_as_user/run_as_group are required and root is rejected.
#   - No credential value ever appears here. Secrets are attached through an
#     OpenShell provider, which injects a placeholder into the sandbox env and
#     substitutes the real value only at the provider-authorized endpoint.
version: 1
filesystem_policy:
  read_only:
    - /usr
    - /lib
    - /bin
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null
  include_workdir: true
process:
  run_as_user: "1000"
  run_as_group: "1000"
