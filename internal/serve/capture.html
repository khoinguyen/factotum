<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow"><a href="/">{{.Project}} dashboard</a></p>
    <h1>Capture an idea</h1>
  </header>

  <main>
    {{if .Configured}}
    <form class="capture" method="post" action="/capture">
      <label for="text">What is the idea?</label>
      <textarea id="text" name="text" rows="5" required autofocus placeholder="One sentence is enough."></textarea>
      <label for="token">Capture token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <button type="submit">Capture idea</button>
      <p class="hint">Stored as an idea immediately; grooming refines it later.</p>
    </form>
    {{else}}
    <p class="empty">Capture is not configured. Set <code>serve.token</code> in the machine config or <code>FACTOTUM_SERVE_TOKEN</code> to enable it.</p>
    {{end}}
  </main>
</div>
{{if .Configured}}
<script>
(function () {
  var input = document.getElementById('token');
  if (!input) { return; }
  try {
    var saved = localStorage.getItem('factotum.capture.token');
    if (saved) { input.value = saved; }
  } catch (e) {}
  if (input.form) {
    input.form.addEventListener('submit', function () {
      try { localStorage.setItem('factotum.capture.token', input.value); } catch (e) {}
    });
  }
})();
</script>
{{end}}
</body>
</html>
