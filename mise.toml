[tools]
go = "1.26.4"
golangci-lint = "2.13.2"
node = "24.20.0"
pnpm = "10.12.2"

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w . && golangci-lint fmt"

[tasks.fmt-check]
description = "Verify Go formatting (exit 1 when files need formatting)"
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "unformatted files:"
  echo "$files"
  exit 1
fi
"""

[tasks.lint]
description = "Run linters"
depends = ["build-web"]
run = "golangci-lint run"

[tasks.test]
description = "Run tests with the race detector"
depends = ["build-web"]
run = "go test -race ./..."

[tasks."test:scripts"]
description = "Run the hermetic shell tests (every scripts/*_test.sh and .agents/skills/chief/scripts/*_test.sh)"
run = """
set -eu
status=0
found=0
for t in scripts/*_test.sh .agents/skills/chief/scripts/*_test.sh; do
  [ -f "$t" ] || continue
  found=$((found + 1))
  echo "== $t"
  bash "$t" || status=1
done
if [ "$found" -eq 0 ]; then
  echo "no *_test.sh found under scripts or .agents/skills/chief/scripts" >&2
  exit 1
fi
exit "$status"
"""

[tasks.test-embed]
description = "Opt-in real-embedding test (starts a llama.cpp container unless FACTOTUM_EMBED_TEST_ENDPOINT is set)"
run = """
set -eu
endpoint="${FACTOTUM_EMBED_TEST_ENDPOINT:-}"
model="${FACTOTUM_EMBED_TEST_MODEL:-nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M}"
provider="${FACTOTUM_EMBED_TEST_PROVIDER:-openai}"
container="${FACTOTUM_EMBED_TEST_CONTAINER:-ft-embed-test}"
volume="${FACTOTUM_EMBED_TEST_VOLUME:-ft-llamacpp-models}"
image="${FACTOTUM_EMBED_TEST_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
port="${FACTOTUM_EMBED_TEST_PORT:-18080}"

if [ -z "$endpoint" ]; then
  if ! command -v docker >/dev/null 2>&1; then
    echo "no FACTOTUM_EMBED_TEST_ENDPOINT set and docker is not installed" >&2
    echo "start an embedding server, then set FACTOTUM_EMBED_TEST_ENDPOINT to it" >&2
    exit 1
  fi
  # The named volume keeps the downloaded model, so re-runs skip the download.
  docker volume create "$volume" >/dev/null
  docker rm -f "$container" >/dev/null 2>&1 || true
  docker run -d --name "$container" -p "127.0.0.1:${port}:8080" -e LLAMA_CACHE=/cache -v "${volume}:/cache" "$image" --embeddings --host 0.0.0.0 --port 8080 --ctx-size 2048 -hf "$model" >/dev/null
  endpoint="http://127.0.0.1:${port}"
  trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT INT TERM
  echo "waiting for ${endpoint}/health"
  i=0
  while [ "$i" -lt 180 ]; do
    if curl -fsS "${endpoint}/health" >/dev/null 2>&1; then
      break
    fi
    i=$((i + 1))
    sleep 1
  done
  if [ "$i" -ge 180 ]; then
    echo "embedding server did not become healthy" >&2
    exit 1
  fi
fi

export FACTOTUM_EMBED_TEST_ENDPOINT="$endpoint"
export FACTOTUM_EMBED_TEST_PROVIDER="$provider"
export FACTOTUM_EMBED_TEST_MODEL="$model"
go test -count=1 -run TestRealEmbedding -v ./internal/cli/
"""

[tasks.cover]
description = "Run tests and print total coverage"
depends = ["build-web"]
run = "go test -race -covermode=atomic -coverprofile=coverage.out ./... && go tool cover -func=coverage.out"

[tasks.bench]
description = "Run hot-path benchmarks (in-process; see budgets in pkg/app/bench_test.go)"
run = "go test -run '^$' -bench . -benchmem ./pkg/..."

[tasks.perf]
description = "End-to-end scale harness: p50/p95 per backend and scale (manual/nightly; results in .perf/)"
depends = ["build"]
run = "go run ./cmd/ftscale --tasks 1000,10000,50000,100000 --out .perf/results.jsonl"

[tasks.perf-quick]
description = "Quick scale-harness smoke: 1k tasks across all backends"
depends = ["build"]
run = "go run ./cmd/ftscale --tasks 1000 --iterations 3 --warmups 1 --out .perf/results.jsonl"

[tasks.spike-openshell]
description = "Opt-in real OpenShell isolation spike (needs a local OpenShell gateway; throwaway workspace, no real credentials)"
run = "spike/openshell/spike.sh"

[tasks.spike-openshell-sdk]
description = "Opt-in probe of the OpenShell Go SDK against the local gateway (mTLS wiring + Files transport status)"
run = "spike/openshell/sdk_probe.sh"

[tasks.test-openshell]
description = "Opt-in live IsolationBackend conformance for the OpenShell backend (needs a local OpenShell gateway; creates and deletes its own sandboxes)"
run = "FACTOTUM_OPENSHELL_TEST=1 go test -count=1 -run TestConformance -v ./pkg/isolation/openshell/"

[tasks.test-docker]
description = "Opt-in live IsolationBackend conformance for the docker backend (needs a running docker daemon; creates and deletes its own containers)"
run = "FACTOTUM_DOCKER_TEST=1 go test -count=1 -run TestConformance -v ./pkg/isolation/docker/"

[tasks.web-install]
description = "Install the web/ frontend dependencies from the frozen lockfile"
run = "pnpm --dir web install --frozen-lockfile"

[tasks.build-web]
description = "Build the shadcn/ui frontend into web/dist (embedded into the Go binary)"
depends = ["web-install"]
run = "pnpm --dir web build"

[tasks.web-dev]
description = "Run the Vite dev server for the frontend (proxies /api and /events to ft serve)"
run = "pnpm --dir web dev"

[tasks.web-test]
description = "Run the frontend render tests (vitest + jsdom)"
depends = ["web-install"]
run = "pnpm --dir web test"

[tasks.web-test-browser]
description = "Run the frontend real-layout tests in headless Chromium (vitest browser mode)"
depends = ["web-install"]
run = """
pnpm --dir web exec playwright install --with-deps chromium
pnpm --dir web test:browser
"""

[tasks.build]
description = "Build the ft CLI to ./bin/ft (never the installed binary)"
depends = ["build-web"]
run = """
mkdir -p bin
version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
go build -ldflags "-X github.com/khoinguyen/factotum/pkg/version.Version=$version" -o bin/ft ./cmd/factotum
"""

[tasks.install]
description = "Install the ft CLI to ~/.local/bin/ft (explicit; build does not do this)"
depends = ["build-web"]
run = """
mkdir -p "$HOME/.local/bin"
version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
go build -ldflags "-X github.com/khoinguyen/factotum/pkg/version.Version=$version" -o "$HOME/.local/bin/ft" ./cmd/factotum
"""

[tasks.smoke-web]
description = "End-to-end smoke: ft serve serves the embedded app and a mutation pushes a live SSE update"
depends = ["build"]
run = "bash scripts/smoke-web.sh"

[tasks.smoke-quickstart]
description = "From-zero smoke: run the README quickstart against a throwaway store"
depends = ["build"]
run = "bash scripts/smoke-quickstart.sh"

[tasks.hooks]
description = "Install the git pre-commit hook"
run = """
mkdir -p .git/hooks
printf '#!/bin/sh\nset -e\nmise run fmt-check\nmise run lint\nmise run test\n' > .git/hooks/pre-commit
chmod +x .git/hooks/pre-commit
echo "installed .git/hooks/pre-commit"
"""

[tasks.ci]
description = "Full check: format, lint, test, coverage, build"
depends = ["fmt-check", "lint", "test", "test:scripts", "cover", "web-test", "web-test-browser", "build", "smoke-web", "smoke-quickstart"]
